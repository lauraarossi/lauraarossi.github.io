<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:image" content="/images/beach1.webp">
<meta name="color-scheme" content="light dark">
<script>document.documentElement.classList.add("js")</script>
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,800;0,900;1,300;1,400&display=swap">
<link rel="stylesheet" href="/assets/styles.css?v={{cssv}}">
<script src="/assets/main.js?v={{jsv}}" defer></script>
</head>
<body class="layout-{{bodyClass}}">
<a class="skip-link" href="#main">Skip to content</a>
<div id="wrapper">

  <header id="header">
    <div class="inner">
      <a href="/" class="logo">
        <span class="symbol"><img src="/images/logo.svg" alt="" width="32" height="24"></span><span class="title">{{siteName}}</span>
      </a>
      <button type="button" class="menu-toggle" aria-controls="menu" aria-expanded="false">
        <span class="bars" aria-hidden="true"></span><span class="label">Menu</span>
      </button>
    </div>
  </header>

  <nav id="menu" aria-label="Main" hidden>
    <div class="menu-inner">
      <h2>Menu</h2>
      <ul>
{{nav}}
      </ul>
    </div>
    <button type="button" class="menu-close" aria-label="Close menu"></button>
  </nav>

  <main id="main">
    <div class="inner">
      <p class="print-only">{{email}} · lauraarossi.com · linkedin.com/in/laura-agustina-rossi · github.com/lauraarossi</p>
{{main}}
    </div>
  </main>

  <footer id="footer">
    <div class="inner">
      <section>

          <li><a href="{{linkedin}}" class="icon" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg></a></li>

        </ul>
      </section>
      <section>
        <h2>Pages</h2>
        <ul class="footer-nav">
{{nav}}
        </ul>
      </section>
      <ul class="copyright">
        <li>&copy; {{year}} {{siteName}}</li>
        <li>Design inspired by &ldquo;Phantom&rdquo; by <a href="https://html5up.net">HTML5 UP</a></li>
      </ul>
    </div>
  </footer>
</div>

<dialog class="lightbox" aria-label="Photo">
  <img alt="">
  <form method="dialog"><button class="lightbox-close" aria-label="Close">&times;</button></form>
</dialog>
</body>
</html>
